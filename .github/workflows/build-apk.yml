name: Build Android APK & Windows

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.2
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Set up release signing
        id: signing
        shell: bash
        run: |
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "KEYSTORE_BASE64 secret not set - building with debug signing"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks
            echo "storeFile=upload-keystore.jks" > android/key.properties
            echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> android/key.properties
            echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release APK
        run: flutter build apk --release

      - name: Build split APKs (per ABI)
        run: flutter build apk --release --split-per-abi

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kanposvn-apk
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
          if-no-files-found: warn

  windows:
    name: Build Windows EXE
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.2
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Package Windows release (zip)
        shell: powershell
        run: |
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "kanposvn-windows-x64.zip" -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: kanposvn-windows
          path: kanposvn-windows-x64.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [android, windows]
    permissions:
      contents: write
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Get version from pubspec
        id: version
        shell: bash
        run: |
          VER=$(grep -m1 '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//')
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Delete previous nightly release
        if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view nightly --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release delete nightly --repo "${{ github.repository }}" --yes --cleanup-tag
            echo "Deleted previous nightly release"
          else
            echo "No existing nightly release to delete"
          fi

      - name: Create GitHub Release (tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/app-release.apk
            artifacts/app-arm64-v8a-release.apk
            artifacts/app-armeabi-v7a-release.apk
            artifacts/app-x86_64-release.apk
            artifacts/kanposvn-windows-x64.zip
          generate_release_notes: true

      - name: Create GitHub Release (nightly from branch push)
        if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: KanPosVN nightly (v${{ steps.version.outputs.version }})
          body: |
            Nightly build from `${{ github.ref_name }}` @ ${{ github.sha }}
            - Version: ${{ steps.version.outputs.version }}
            - Commit: ${{ github.event.head_commit.message || 'manual trigger' }}
          prerelease: true
          files: |
            artifacts/app-release.apk
            artifacts/app-arm64-v8a-release.apk
            artifacts/app-armeabi-v7a-release.apk
            artifacts/app-x86_64-release.apk
            artifacts/kanposvn-windows-x64.zip

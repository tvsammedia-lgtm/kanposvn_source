name: kanposvn
description: KanPosVN - Ung dung quan ly da nang (Nha Thuoc, Cafe/Tra Sua, Nhan Su, VLXD)
publish_to: 'none'
version: 1.1.4+4

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_riverpod: 2.6.1
  shared_preferences: 2.5.5
  http: 1.2.2
  fl_chart: 0.70.2
  intl: 0.20.2
  path_provider: 2.1.5
  isar: 3.1.0+1
  isar_flutter_libs: 3.1.0+1
  uuid: ^4.4.0
  file_picker: ^11.0.2
  mobile_scanner: ^7.4.0
  pdf: ^3.10.7
  printing: ^5.11.1
  qr: ^3.0.2
  image: ^4.8.0
  dio: ^5.4.0
  archive: ^4.0.0
  go_router: ^14.1.4
  share_plus: ^12.0.2
  url_launcher: ^6.3.0
  google_fonts: ^6.2.1
  usb_serial: ^0.5.2
  blue_thermal_printer: ^1.2.3
  esc_pos_utils_plus: 2.0.4
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  isar_generator: 3.1.0+1
  build_runner: 2.4.13

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/kanji_data.json
    - assets/engpic/engpic_words.json
    - assets/engpic/images/
    - assets/sprites/mingming/idle/
    - assets/sprites/mingming/walk/
    - assets/sprites/mingming/run/
    - assets/sprites/mingming/aim/
    - assets/sprites/mingming/shoot/
    - assets/sprites/mingming/hit/
    - assets/sprites/mingming/fall/
    - assets/sprites/mingming/dead/
    - assets/sprites/wangtta/idle/
    - assets/sprites/wangtta/walk/
    - assets/sprites/wangtta/run/
    - assets/sprites/wangtta/aim/
    - assets/sprites/wangtta/shoot/
    - assets/sprites/wangtta/hit/
    - assets/sprites/wangtta/fall/
    - assets/sprites/wangtta/dead/
    - assets/sounds/nemda_hit.wav
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
